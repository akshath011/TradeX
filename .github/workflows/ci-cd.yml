name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            dashboard/package-lock.json
            backend/package-lock.json

      - name: Backend - install and syntax check
        working-directory: backend
        run: |
          npm ci
          find . -name "*.js" -not -path "./node_modules/*" -print0 | xargs -0 -n1 node --check

      - name: Landing page - install, test, build
        working-directory: frontend
        run: |
          npm ci
          npm test -- --watchAll=false
          npm run build
        env:
          CI: false

      - name: Dashboard - install and build
        working-directory: dashboard
        run: |
          npm ci
          npm run build
        env:
          CI: false
          PUBLIC_URL: /dashboard
          REACT_APP_API_URL: /api

  deploy:
    name: Deploy to Vercel
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build dashboard
        working-directory: dashboard
        run: |
          npm ci
          npm run build
        env:
          CI: false
          PUBLIC_URL: /dashboard
          REACT_APP_API_URL: /api

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel settings
        working-directory: frontend
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build landing page
        working-directory: frontend
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Add dashboard to the build output
        run: |
          mkdir -p frontend/.vercel/output/static/dashboard
          cp -r dashboard/build/. frontend/.vercel/output/static/dashboard/

      - name: Deploy
        working-directory: frontend
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}